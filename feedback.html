<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Форма зворотного зв’язку освітнього порталу Learn + earn для пропозицій, співпраці та повідомлень про помилки.">
    <title>Зворотний зв’язок — Learn + earn</title>
    <link rel="icon" href="lab5/assets/logo.webp" type="image/webp">
    <link rel="stylesheet" href="lab5/assets/fonts.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="lab5/lab5.css">
    <script src="app.js" defer></script>
    <script src="lab4.js" defer></script>
  </head>

  <body class="page-feedback">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <img class="brand-logo" src="lab5/assets/logo.webp" width="42" height="42" alt="Логотип Learn + earn" onerror="this.style.display='none'">
          <span>Learn <b>+</b> earn</span>
        </a>
        <nav aria-label="Основна навігація">
          <a href="index.html">Головна</a>
          <a href="topics.html">Навчальні теми</a>
          <a href="feedback.html" aria-current="page">Зворотний зв’язок</a>
          <a href="lab3.html">Лабораторна №3</a>
        </nav>
        <div class="auth-actions" data-auth-actions></div>
      </div>
    </header>

    <main class="form-page">
      <section class="form-card">
        <p class="eyebrow">Ми на зв’язку</p>
        <h1>Зворотний зв’язок</h1>
        <p>Заповніть форму — ми врахуємо ваше повідомлення.</p>

        <form id="feedback-form">
          <fieldset>
            <legend>Персональна інформація</legend>

            <label for="fullname">Прізвище та ім’я</label>
            <input id="fullname" name="fullname" type="text" minlength="2" maxlength="100" pattern=".*\S.*" title="Введіть щонайменше 2 символи." required autocomplete="name">

            <label for="feedback-email">E-mail</label>
            <input id="feedback-email" name="email" type="email" pattern=".+@gmail\.com" title="Використовуйте адресу Gmail, наприклад name@gmail.com." required autocomplete="email">

            <label for="age">Вік</label>
            <input id="age" name="age" type="number" min="1" max="120" required>

            <label for="learning-status">Чи вже ви вивчаєте мову?</label>
            <select id="learning-status" name="learning-status" required>
              <option value="" selected disabled>Оберіть відповідь</option>
              <option value="pro">Так, я профі</option>
              <option value="beginner">Так, але знаю початки</option>
              <option value="plan">Планую</option>
              <option value="no">Ні</option>
            </select>
          </fieldset>

          <label for="feedback-topic">Мета зворотного зв’язку</label>
          <select id="feedback-topic" name="topic" required>
            <option value="" selected disabled>Оберіть мету</option>
            <option value="cooperation">Співпраця</option>
            <option value="complaint">Скарга на неякісний контент</option>
            <option value="suggestion">Пропозиція</option>
            <option value="error">Наявність помилки</option>
          </select>

          <label for="feedback-message">Детально</label>
          <textarea id="feedback-message" name="message" rows="6" cols="40" minlength="10" maxlength="500" title="Повідомлення має містити щонайменше 10 символів." required></textarea>

          <label class="consent" for="consent">
            <input id="consent" name="consent" type="checkbox" required>
            Я згоден / згодна на обробку моїх даних
          </label>

          <button class="button" type="submit">Надіслати</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <footer>
      <p>© 2026 Learn + earn.</p>
    </footer>
  </body>
</html>
